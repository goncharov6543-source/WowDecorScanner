
    <!DOCTYPE html>
    <html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WoW Low Price Finder</title>
        <style>
            body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; margin: 0; }
            .container { max-width: 900px; margin: 0 auto; }
            h1 { text-align: center; color: #fff; margin-bottom: 30px; }
            
            table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
            
            .item-row { background: #1e1e1e; transition: transform 0.2s; }
            .item-row:hover { transform: scale(1.01); background: #252525; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
            
            td { padding: 15px; border-top: 1px solid #333; border-bottom: 1px solid #333; }
            td:first-child { border-left: 1px solid #333; border-radius: 8px 0 0 8px; }
            td:last-child { border-right: 1px solid #333; border-radius: 0 8px 8px 0; font-weight: bold; color: #aaa; }

            .item-wrapper { display: flex; align-items: center; gap: 15px; }
            img { width: 46px; height: 46px; border-radius: 6px; border: 1px solid #444; }
            
            .item-info { display: flex; flex-direction: column; }
            .item-name { font-weight: bold; font-size: 1.1em; color: #a335ee; } /* Epic purple color */
            .item-id { font-size: 0.8em; color: #666; }
            
            .price-cell { text-align: right; }
            .gold { color: #ffd700; font-weight: bold; font-size: 1.2em; }
            
            .update-time { text-align: center; color: #555; margin-top: 30px; font-size: 0.9em; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>💎 Найнижчі ціни (EU Region)</h1>
            
            <table>
                
        <tr class="item-row">

                    <div class="item-info">
                        <span class="item-name">Arakkoa Decoy Scarecrow</span>
                        <span class="item-id">ID: 258191</span>
                    </div>
                </div>
            </td>
            <td class="price-cell">
                <span class="gold">5,200.98 g</span>
            </td>
            <td>Auchindoun</td>
        </tr>
    
        <tr class="item-row">

                    <div class="item-info">
                        <span class="item-name">Draenei Crystal Chandelier</span>
                        <span class="item-id">ID: 262347</span>
                    </div>
                </div>
            </td>
            <td class="price-cell">
                <span class="gold">6,999.06 g</span>
            </td>
            <td>Rexxar</td>

        <tr class="item-row">
            <td class="icon-cell">
                <div class="item-wrapper">
                    <img src="https://render.worldofwarcraft.com/eu/icons/56/inv_dr_loom_01.jpg" alt="Draenei Weaver's Loom">
                    <div class="item-info">
                        <span class="item-name">Draenei Weaver's Loom</span>
                        <span class="item-id">ID: 258195</span>
                    </div>
                </div>
            </td>
            <td class="price-cell">
                <span class="gold">13,500.88 g</span>
            </td>
            <td>Antonidas</td>
        </tr>
    
        <tr class="item-row">
            <td class="icon-cell">
                <div class="item-wrapper">
                    <img src="https://render.worldofwarcraft.com/eu/icons/56/inv_dr_bench_01_nosound.jpg" alt="Halaa Bench">
                    <div class="item-info">
                        <span class="item-name">Halaa Bench</span>
                        <span class="item-id">ID: 258215</span>
                    </div>
                </div>
            </td>
            <td class="price-cell">
                <span class="gold">5,400.11 g</span>
            </td>
            <td>Silvermoon</td>
        </tr>
    
            </table>

            <div class="update-time">Останнє оновлення: 1/12/2026, 3:35:38 PM</div>
        </div>
    </body>
    </html>
