name: Update Prices & Deploy

on:
  schedule:
    - cron: '0 */1 * * *' # Запускати щогодини
  workflow_dispatch: # Кнопка для ручного запуску

# Глобальні дозволи
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # РОБОТА 1: Оновлюємо ціни, зберігаємо історію та готуємо сайт
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Scanner Script
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: node index.js

      - name: Commit and Push History
        run: |
          git config --global user.name "WoW Decor Bot"
          git config --global user.email "actions@github.com"
          git add price_history.json
          if git diff --staged --quiet; then
            echo "No changes in price history"
          else
            git commit -m "Update price history [skip ci]"
            git push
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  # РОБОТА 2: Публікуємо сайт (окремий процес)
  deploy:
    needs: update-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4