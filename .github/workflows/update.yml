name: Update Prices

on:
  schedule:
    - cron: '0 */1 * * *' # Запуск щогодини
  workflow_dispatch: # Кнопка для ручного запуску

permissions:
  contents: write # ДОЗВІЛ НА ЗАПИС ФАЙЛІВ

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Run Script
      env:
        BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
        BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      run: node index.js

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        # Додаємо файли, які змінилися
        git add public/index.html
        git add price_history.json
        
        # Перевіряємо, чи є зміни, перед комітом
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update prices and history [skip ci]"
          git push
        fi